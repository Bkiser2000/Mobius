name: Build, Test & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      
      - name: Build
        run: make clean all
      
      - name: Unit tests
        run: make test-unit
      
      - name: Integration tests
        run: |
          export MOBIUS_AUDIT_SIGN_KEY="ci-test-key-123456789"
          make test-integration
      
      - name: Audit verification
        run: |
          export MOBIUS_AUDIT_SIGN_KEY="ci-test-key-123456789"
          make test-audit

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3
      
      - name: Extract version
        id: vars
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Build Docker image
        run: docker build -t mobius-scorer:${{ steps.vars.outputs.version }} .
      
      - name: Push to registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag mobius-scorer:${{ steps.vars.outputs.version }} \
            ${{ secrets.DOCKER_REGISTRY }}/mobius-scorer:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/mobius-scorer:${{ steps.vars.outputs.version }}

  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3
      
      - name: Build release artifacts
        run: make tarball
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/mobius-*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}